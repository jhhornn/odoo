name: odoo-api
region: lon

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

databases:
  - cluster_name: octohealth-v2
    db_name: odoo-dev
    db_user: odoo
    engine: PG
    name: octohealth-v2
    production: true

envs:
  - key: NODE_ENV
    scope: RUN_AND_BUILD_TIME
    value: production

  - key: PORT
    scope: RUN_AND_BUILD_TIME
    value: "3000"

  - key: APP_HOSTNAME
    scope: RUN_TIME
    value: "0.0.0.0"

  - key: REDIS_URL
    scope: RUN_AND_BUILD_TIME
    value: redis://redis:6379

  # Resolved from the bound DB cluster at deploy time — not a secret
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: postgresql://${octohealth-v2.USERNAME}:${octohealth-v2.PASSWORD}@${octohealth-v2.PRIVATE_HOSTNAME}:${octohealth-v2.PORT}/${octohealth-v2.DATABASE}?schema=public&sslmode=require

ingress:
  rules:
    - component:
        name: nest-odoo-integration
      match:
        path:
          prefix: /

services:
  - name: nest-odoo-integration
    environment_slug: node-js
    github:
      repo: jhhornn/odoo
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: yarn install --frozen-lockfile --production=false && yarn prisma:generate && yarn build
    run_command: npx prisma migrate deploy && yarn start
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed

    health_check:
      http_path: /doc
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

  - name: redis
    image:
      registry: library
      registry_type: DOCKER_HUB
      repository: redis
      tag: 7-alpine
    instance_count: 1
    instance_size_slug: basic-xxs
    internal_ports:
      - 6379

